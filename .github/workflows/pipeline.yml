name: pipeline
on: [pull_request]
permissions:
  contents: read
  pull-requests: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high
      - run: pip install semgrep
      - run: semgrep scan --config p/javascript --error
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: docker run --rm -v "$PWD":/src aquasec/trivy:latest config --exit-code 1 --severity HIGH,CRITICAL /src
      - name: DAST con ZAP
        run: |
          node app.js &
          curl --retry 10 --retry-delay 1 --retry-connrefused -s http://localhost:3000/ > /dev/null
          chmod a+w "$PWD"
          docker run --rm --network host -v "$PWD":/zap/wrk/:rw ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t http://localhost:3000 -I -r reporte-zap.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-zap
          path: reporte-zap.html
